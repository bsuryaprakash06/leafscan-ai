services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leafscan-backend
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:7860
    container_name: leafscan-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
